version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns:
          - "@astrojs/*"
        update-types:
          - "minor"
          - "patch"
      tailwindcss:
        patterns:
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
 
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
    cooldown:
      default-days: 7

site:
  name: Schweizer Klub Norwegen Oslo
  site: 'https://www.schweizerklub.no'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: Schweizer Klub Norwegen Oslo
    template: '%s — Schweizer Klub Norwegen Oslo'
  description: "Der Schweizer Klub Norwegen Oslo verbindet in Norwegen lebende SchweizerInnen und Personen mit einer speziellen Verbindung zur Schweiz."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Schweizer Klub Norwegen Oslo
    images:
      - url: '/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@schweizerklub'
    site: '@schweizerklub'
    cardType: summary_large_image

i18n:
  language: de
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'

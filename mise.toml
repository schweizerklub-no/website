[tools]
node = "24"
pnpm = "11.5.2"

[tasks."install"]
description = "Install dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.modules.yaml"]

[tasks.dev]
description = "Run in development mode"
depends = "install"
run = "pnpm run dev"

[tasks.build]
description = "Build the project"
depends = "install"
run = "pnpm run build"

[tasks.preview]
description = "Preview the production build"
depends = "build"
run = "pnpm run preview"

[tasks.fix]
description = "Fix lint issues and format code"
depends = "install"
run = "pnpm biome check --write --unsafe . && pnpm astro check"

[tasks.test]
description = "Run unit tests"
depends = "install"
run = "pnpm test"

[tasks.verify]
description = "TypeScript check, lint, test, and build"
depends = "install"
run = "pnpm astro check && pnpm biome check . && pnpm test && pnpm build"
